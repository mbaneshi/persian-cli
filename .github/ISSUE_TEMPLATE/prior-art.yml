name: Prior-art suggestion
description: A project, spec, patch or thread we should study
labels: ["type/research"]
body:
  - type: input
    id: link
    attributes: { label: Link }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What it does, description: "Which layers does it address? Have you used it?" }
    validations: { required: true }
  - type: markdown
    attributes:
      value: "We'll read the code and add it to the [prior-work catalog](https://mbaneshi.github.io/persian-cli/prior-work/), keeping *verified in code* separate from *claimed*."
